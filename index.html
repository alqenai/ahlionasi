  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0E2A47;
      --deep: #12385E;
      --teal: #2EC4B6;
      --coral: #FF8A80;
      --pearl: #F4EFE6;
      --sand: #E9C46A;
      --sky: #8FB8DE;
      --muted: #9DB2C8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0B233B; }
    body {
      font-family: "Readex Pro", system-ui, sans-serif;
      color: var(--pearl);
      background: #0B233B;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px calc(28px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      text-align: center;
    }
    .sea {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(90% 55% at 50% 34%, rgba(46, 196, 182, .10), transparent 70%),
        radial-gradient(120% 80% at 50% 30%, #16466F 0%, var(--navy) 58%, #0A2036 100%);
    }
    .bub {
      position: fixed; bottom: -40px; left: var(--x);
      width: var(--s); height: var(--s); border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .75) 0 16%, transparent 24%), rgba(255, 255, 255, .03);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .32);
      opacity: 0; z-index: 0; pointer-events: none;
      animation: rise var(--d) linear var(--w) infinite;
    }
    @keyframes rise {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: .5; }
      50% { transform: translate(14px, -55vh); }
      88% { opacity: .35; }
      100% { transform: translate(-8px, -112vh); opacity: 0; }
    }

    main { position: relative; z-index: 1; width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; }

    .mark { width: clamp(150px, 46vw, 210px); height: auto; overflow: visible; }
    .mark .ring-l { animation: inL 1s cubic-bezier(.2, .8, .2, 1) .15s both; }
    .mark .ring-r { animation: inR 1s cubic-bezier(.2, .8, .2, 1) .15s both; }
    .mark .pearl { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.3, 1.6, .5, 1) .95s both; }
    .mark .glow { transform-box: fill-box; transform-origin: center; animation: glow 3.4s ease-in-out 1.7s infinite; opacity: 0; }
    @keyframes inL { from { transform: translateX(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes inR { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes glow { 0%, 100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }

    h1 {
      font-size: clamp(2.9rem, 13vw, 4.6rem);
      font-weight: 700;
      line-height: 1.25;
      margin-top: 18px;
      animation: up .8s ease-out .5s both;
    }
    h1 span { color: var(--teal); }
    .latin {
      direction: ltr;
      font-size: clamp(.85rem, 3.6vw, 1rem);
      font-weight: 400;
      letter-spacing: .32em;
      padding-left: .32em;
      color: var(--sand);
      margin-top: 14px;
      animation: up .8s ease-out .65s both;
    }
    .tag {
      font-size: clamp(1.1rem, 4.6vw, 1.35rem);
      font-weight: 400;
      line-height: 1.7;
      margin-top: 26px;
      text-wrap: balance;
      animation: up .8s ease-out .8s both;
    }
    .tag-en {
      direction: ltr;
      font-size: .95rem;
      font-weight: 300;
      line-height: 1.6;
      color: var(--muted);
      max-width: 36ch;
      text-wrap: balance;
      margin-top: 8px;
      animation: up .8s ease-out .9s both;
    }
    .chips {
      list-style: none;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      margin: 26px 0 30px;
      animation: up .8s ease-out 1s both;
    }
    .chips li {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 999px;
      font-size: .95rem; font-weight: 500;
      background: rgba(244, 239, 230, .06);
      box-shadow: inset 0 0 0 1px rgba(244, 239, 230, .16);
    }
    .chips i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
    .soon {
      display: inline-flex; align-items: center; gap: 12px;
      background: var(--pearl); color: var(--navy);
      padding: 12px 24px; border-radius: 999px;
      font-size: 1.15rem; font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      animation: up .8s ease-out 1.1s both;
    }
    .soon .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 0 rgba(46, 196, 182, .6); animation: ping 2s ease-out 2s infinite; }
    .soon .en { direction: ltr; font-size: .85rem; font-weight: 500; color: #4A5F78; }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(46, 196, 182, .6); } 80%, 100% { box-shadow: 0 0 0 10px rgba(46, 196, 182, 0); } }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    footer {
      position: relative; z-index: 1;
      margin-top: 44px;
      direction: ltr;
      font-size: .8rem; letter-spacing: .14em;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .mark .glow { opacity: .6; }
      .bub { display: none; }
    }
  </style>
</head>
<body>
  <div class="sea" aria-hidden="true"></div>
  <span class="bub" style="--x:8%;--s:10px;--d:19s;--w:0s" aria-hidden="true"></span>
  <span class="bub" style="--x:22%;--s:6px;--d:15s;--w:-6s" aria-hidden="true"></span>
  <span class="bub" style="--x:37%;--s:8px;--d:23s;--w:-12s" aria-hidden="true"></span>
  <span class="bub" style="--x:61%;--s:12px;--d:21s;--w:-3s" aria-hidden="true"></span>
  <span class="bub" style="--x:76%;--s:7px;--d:17s;--w:-9s" aria-hidden="true"></span>
  <span class="bub" style="--x:90%;--s:9px;--d:25s;--w:-15s" aria-hidden="true"></span>

  <main>
    <svg class="mark" viewBox="9 24 102 72" role="img" aria-label="شعار أهلي وناسي: حلقتين مربوطة وبالنص لولوة">
      <defs>
        <radialGradient id="pearl" cx="0.36" cy="0.3" r="0.78">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#F4EFE6"/><stop offset="1" stop-color="#D3C08F"/>
        </radialGradient>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#FFF4D6" stop-opacity=".6"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="glow" cx="60" cy="60" r="20" fill="url(#glow)"/>
      <g class="ring-r"><path d="M63.82 27.62A34.25 34.25 0 1 1 48.92 37.79A22.55 22.55 0 0 1 57.42 41.18A25.75 25.75 0 1 0 72.32 34.39A37.45 37.45 0 0 0 63.82 27.62Z" fill="#FF8A80"/></g>
      <g class="ring-l"><path d="M63.82 27.62A34.25 34.25 0 1 1 48.92 37.79A22.55 22.55 0 0 1 57.42 41.18A25.75 25.75 0 1 0 72.32 34.39A37.45 37.45 0 0 0 63.82 27.62Z" transform="rotate(180 60 60)" fill="#2EC4B6"/></g>
      <circle class="pearl" cx="60" cy="60" r="9.5" fill="url(#pearl)"/>
    </svg>

    <h1>أهلي <span>و</span>ناسي</h1>
    <div class="latin" lang="en">ahli o nasi</div>

    <p class="tag">ارسم أهلك وناسك ودوايرك<br>في صورة وحدة، وشاركها ستوري</p>
    <p class="tag-en" lang="en">Map your family, your friends and everyone in between, then share it as a story.</p>

    <ul class="chips" aria-label="الدواير">
      <li><i style="--c:var(--coral)"></i>الأهل</li>
      <li><i style="--c:var(--teal)"></i>الربع</li>
      <li><i style="--c:var(--sand)"></i>الديوانية</li>
      <li><i style="--c:var(--sky)"></i>الدوام</li>
      <li><i style="--c:var(--pearl)"></i>الهوايات</li>
    </ul>

    <div class="soon"><span class="dot" aria-hidden="true"></span>قريبًا <span class="en" lang="en">Coming soon</span></div>
  </main>

  <footer>© <span id="y">2026</span> AHLIONASI.COM</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
